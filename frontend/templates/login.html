<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBCBot - Connexion</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.1/css/all.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh; margin: 0;">

    <div class="card shadow-sm border-0" style="width: 100%; max-width: 400px; border-radius: 8px; overflow: hidden;">
        <div class="card-header bg-dark text-white text-center py-3">
            <h5 class="mb-0 fw-bold">Connexion à l'espace administrateur</h5>
        </div>
        <div class="card-body p-4">
            
            <!-- Alert Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' }} alert-dismissible fade show small py-2 mb-3" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.5rem 0.5rem;"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% if msg %}
                <div class="text-center alert alert-danger alert-dismissible fade show small py-2 mb-3" role="alert">
                    {{ msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.5rem 0.5rem;"></button>
                </div>
            {% endif %}

            <form action="/login" method="POST">
                
                <!-- Nom d'utilisateur (Username) -->
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary small fw-bold">Nom d'utilisateur</label>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-white border-end-0 text-secondary"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" id="username" placeholder="Username" required class="form-control border-start-0 ps-0">
                    </div>
                </div>

                <!-- Mot de passe (Password) -->
                <div class="mb-3">
                    <label for="password" class="form-label text-secondary small fw-bold">Mot de passe</label>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-white border-end-0 text-secondary"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" id="password" placeholder="Password" required class="form-control border-start-0 ps-0">
                    </div>
                </div>

                <!-- Bouton de connexion -->
                <button type="submit" class="btn btn-dark btn-sm w-100 fw-bold py-2 mt-3">Se connecter</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
